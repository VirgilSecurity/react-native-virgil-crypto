def DEFAULT_COMPILE_SDK_VERSION = 34
def DEFAULT_MIN_SDK_VERSION = 23
def DEFAULT_TARGET_SDK_VERSION = 34
def DEFAULT_ANDROID_GRADLE_PLUGIN_VERSION = '8.3.2'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

apply plugin: 'com.android.library'

buildscript {
    if (project == rootProject) {
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath "com.android.tools.build:gradle:${safeExtGet('androidGradlePluginVersion', DEFAULT_ANDROID_GRADLE_PLUGIN_VERSION)}"
        }
    }
}

android {
    namespace 'com.virgilsecurity.rn.crypto'
    compileSdkVersion safeExtGet('compileSdkVersion', DEFAULT_COMPILE_SDK_VERSION)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', DEFAULT_MIN_SDK_VERSION)
        targetSdkVersion safeExtGet('targetSdkVersion', DEFAULT_TARGET_SDK_VERSION)
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()
}

// Single source of truth for the Virgil versions, matching the convention in
// virgil-e3kit-kotlin/build.gradle. crypto-android 7.5.1 resolves
// foundation-android 0.19.1 transitively; it is pinned here so the resolved
// version cannot drift under Gradle's newest-wins strategy.
def virgilSdkVersion = '7.5.1'
def virgilCryptoVersion = '0.19.1'

dependencies {
    //noinspection GradleDynamicVersion
    implementation 'com.facebook.react:react-native:+'  // From node_modules

    implementation "com.virgilsecurity.sdk:crypto-android:${virgilSdkVersion}"
    implementation "com.virgilsecurity.crypto:foundation-android:${virgilCryptoVersion}"
    // pythia-android is gone: virgil-crypto-c 0.19.1 removed the Pythia module
    // and password hardening moved into foundation as BrainkeyClient.
}
